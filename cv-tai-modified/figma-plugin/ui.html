<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>
  body { font: 12px/1.4 Inter, system-ui, sans-serif; margin: 12px; color: #1e293b; }
  textarea { width: 100%; height: 190px; box-sizing: border-box; font: 11px/1.4 ui-monospace, monospace; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; }
  button { margin-top: 8px; width: 100%; height: 32px; border: 0; border-radius: 6px; background: #4e5bf2; color: #fff; font-weight: 600; cursor: pointer; }
  label { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
  #report { margin-top: 10px; white-space: pre-wrap; color: #475569; }
  .err { color: #b91c1c; }
</style>
</head>
<body>
  <p>Dans Dispatch, page résultat : <b>Pour Figma</b>, puis colle ici.</p>
  <textarea id="payload" placeholder='{"version":1,"name":"…"}'></textarea>
  <label><input type="checkbox" id="selection" checked /> Seulement la sélection (sinon toute la page)</label>
  <button id="fill">Remplir le template</button>
  <div id="report"></div>
<script>
  const report = document.getElementById("report");
  document.getElementById("fill").onclick = () => {
    report.className = ""; report.textContent = "";
    let payload;
    try { payload = JSON.parse(document.getElementById("payload").value); }
    catch (e) { report.className = "err"; report.textContent = "JSON invalide : recopie depuis Dispatch."; return; }
    parent.postMessage({ pluginMessage: { type: "fill", payload, selectionOnly: document.getElementById("selection").checked } }, "*");
  };
  onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg || msg.type !== "report") return;
    report.className = msg.ok ? "" : "err";
    report.textContent = msg.text;
  };
</script>
</body>
</html>
