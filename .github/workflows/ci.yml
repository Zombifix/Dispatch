name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cv-tai-modified
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dispatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/dispatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: cv-tai-modified/.nvmrc
          cache: npm
          cache-dependency-path: cv-tai-modified/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run check
      - name: Tests
        run: npm test
      - name: Migrations à jour avec le schéma
        run: |
          npx drizzle-kit generate --name ci-drift-check
          if [ -n "$(git status --porcelain migrations)" ]; then
            echo "::error::shared/schema.ts a changé sans migration : lancer npm run db:generate"
            git status --porcelain migrations
            exit 1
          fi
      - name: Build
        run: npm run build
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high
